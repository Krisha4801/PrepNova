<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Mock interview studio</p>
        <h1>Interview Simulator</h1>
      </div>

      <div class="top-actions">
        <div id="status" class="status" aria-live="polite">
          <span>Ready</span>
        </div>
        <button id="newSessionButton" class="button secondary" type="button" hidden>New Session</button>
      </div>
    </header>

    <section class="workspace">
      <form id="startForm" class="setup-panel" aria-label="Interview setup">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Session setup</p>
            <h2>Candidate Profile</h2>
          </div>
        </div>

        <div class="form-grid">
          <label>
            Name
            <input id="name" autocomplete="name" placeholder="Your name">
          </label>

          <label>
            Role
            <select id="role" required>
              <option value="" selected disabled>Select role</option>
              <option value="Frontend Developer">Frontend Developer</option>
              <option value="Backend Developer">Backend Developer</option>
              <option value="Fullstack Developer">Fullstack Developer</option>
              <option value="AI/ML Engineer">AI/ML Engineer</option>
              <option value="Data Analyst">Data Analyst</option>
              <option value="Cloud Engineer">Cloud Engineer</option>
              <option value="HR">HR</option>
              <option value="Finance">Finance</option>
              <option value="Manager">Manager</option>
            </select>
          </label>

          <label>
            Difficulty
            <select id="level">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </label>
        </div>

        <button id="startButton" class="button primary" type="submit">Start Interview</button>
      </form>

      <section id="interviewShell" class="interview-shell" aria-label="Interview session" hidden>
        <div class="session-bar">
          <div>
            <p class="eyebrow">Live session</p>
            <h2 id="sessionTitle">Interview</h2>
          </div>

          <div class="progress-panel" aria-label="Interview progress">
            <div class="progress-copy">
              <span id="progressText">Question 1 of 6</span>
              <span id="levelText">Beginner</span>
            </div>
            <div class="progress-track" aria-hidden="true">
              <span id="progressFill"></span>
            </div>
          </div>
        </div>

        <section id="chat" class="chat" aria-live="polite" aria-label="Interview conversation"></section>

        <form id="inputArea" class="input-area" aria-label="Answer input">
          <textarea id="answerInput" rows="4" placeholder="Type your answer..."></textarea>
          <div class="composer-actions">
            <button id="skipButton" class="button secondary" type="button">Skip</button>
            <button id="sendButton" class="button primary" type="submit">Submit</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
